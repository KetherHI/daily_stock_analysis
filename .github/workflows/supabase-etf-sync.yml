name: Supabase ETF daily sync

on:
  workflow_dispatch:
  schedule:
    - cron: '35 17 * * 1-5'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: supabase-market-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: market_data_pipeline
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MARKET_SYMBOLS: '563020'
      INITIAL_BACKFILL_DAYS: '365'
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment secrets
        id: config
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "::warning::Configure SUPABASE_URL and SUPABASE_SECRET_KEY in repository Actions secrets. No market data will be written."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data_pipeline/requirements.txt
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt
      - name: Check database
        if: steps.config.outputs.ready == 'true'
        run: python -m src.check_db
      - name: Sync ETF daily bars
        if: steps.config.outputs.ready == 'true'
        run: python -m src.sync_etf_daily
